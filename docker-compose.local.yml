# Local MySQL only.
#
# docker-compose.yml is the deployment stack (app + db on the external `tolery`
# network, no published ports). For local dev the app runs natively via
# `python run.py`, so all it needs is a reachable MySQL - src/api/main.py calls
# init_db() at import time and the process exits if that connection fails.
#
# Start:  docker compose -f docker-compose.local.yml up -d
# Stop:   docker compose -f docker-compose.local.yml down
#
# Then point .env at it:
#   MYSQL_HOST=127.0.0.1
#   MYSQL_PORT=3307

services:
  db:
    image: mysql:8.0
    container_name: tolery_mysql_local
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # src/database/database.py connects with auth_plugin="mysql_native_password",
    # which is not MySQL 8's default (caching_sha2_password).
    # Dev-only tuning: MySQL 8 mặc định giữ ~400 MB (buffer pool 128M +
    # performance_schema). Dataset local rất nhỏ nên hạ xuống ~150 MB.
    command:
      - mysqld
      - --default-authentication-plugin=mysql_native_password
      - --bind-address=0.0.0.0
      - --innodb-buffer-pool-size=64M
      - --performance-schema=OFF
      - --max-connections=50
    mem_limit: 512m
    ports:
      - "3307:3306"
    volumes:
      - tolery_mysql_local:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  tolery_mysql_local:
