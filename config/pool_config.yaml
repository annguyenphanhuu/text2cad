# TextToCAD Multi-User Resource Pool Configuration
# Phase 1: Resource Pooling Foundation Configuration

# NOTE: Agent Pool Manager has been removed and replaced with Singleton Pattern
# The following agent_pool configuration is no longer used and kept for reference only
#
# # Agent Pool Manager Configuration (DEPRECATED - NOT USED)
# agent_pool:
#   min_agents: 5
#   max_agents: 20
#   scale_up_threshold: 0.7
#   scale_down_threshold: 0.2
#   agent_idle_timeout: 180
#   scaling_check_interval: 15
#   metrics_retention_hours: 24
#   enable_detailed_metrics: true
#   max_concurrent_acquisitions: 50
#   acquisition_timeout: 20
#   enable_auto_scaling: true
#   scaling_cooldown: 30
#   max_scale_up_per_cycle: 3
#   max_scale_down_per_cycle: 2

# Redis Configuration
redis:
  url: "redis://localhost:6379/0"
  session_ttl: 86400  # 24 hours in seconds
  key_prefix: "tolery:session:"
  max_retries: 3
  connection_timeout: 5
  socket_timeout: 5
  health_check_interval: 30

# LLM Connection Pool Configuration
llm_pool:
  # Pool settings
  min_connections: 2
  max_connections: 10
  connection_timeout: 30
  idle_timeout: 300  # 5 minutes
  max_retries: 3
  
  # OpenAI API settings
  api_key: "${OPENAI_API_KEY}"  # Environment variable
  base_url: "https://api.openai.com/v1"
  
  # Model configurations
  models:
    default:
      name: "gpt-3.5-turbo"
      max_tokens: 4096
      temperature: 0.7
      timeout: 30
    advanced:
      name: "gpt-4"
      max_tokens: 8192
      temperature: 0.5
      timeout: 60
    expert:
      name: "gpt-4-turbo"
      max_tokens: 16384
      temperature: 0.3
      timeout: 90
  
  # Health check settings
  health_check_interval: 60  # seconds
  health_check_timeout: 10

# RAG Retriever Pool Configuration
rag_pool:
  # Pool settings - Increased for better concurrent performance
  pool_size: 8
  max_concurrent_requests: 30  # Increased from 20 for better throughput
  
  # FAISS Index settings (CRITICAL for memory optimization)
  faiss_index_path: "data/main_rag_index.index"
  metadata_json_path: "data/main_rag_index_metadata.json"
  
  # Embedding model settings
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  embedding_device: "cpu"  # or "cuda" if GPU available
  
  # Structured data paths
  structured_data:
    materials_csv: "data/Materials/materials.csv"
    processes_csv: "data/Manufacturing_Processes/processes.csv"
    shapes_json: "data/shapes.json"
  
  # Search settings - Optimized for performance
  default_top_k: 5
  max_top_k: 15  # Reduced from 20 to improve response time
  similarity_threshold: 0.7
  
  # Memory optimization
  enable_memory_monitoring: true
  memory_check_interval: 300  # 5 minutes

# FreeCAD Client Pool Configuration
freecad_pool:
  # Pool settings - Increased to support >10 concurrent users
  min_clients: 5
  max_clients: 15
  client_timeout: 45  # Reduced timeout for faster response
  max_retries: 3
  
  # FreeCAD Server settings
  server_url: "http://localhost:8001"  # Default FreeCAD server URL
  server_timeout: 90  # Reduced timeout for better performance
  
  # Health check settings - More frequent checks
  health_check_interval: 60   # 1 minute - more frequent health checks
  health_check_timeout: 20    # Reduced timeout
  max_consecutive_failures: 3
  
  # Request settings - Optimized timeouts
  default_timeout: 45
  max_timeout: 180  # Reduced from 300 for faster response
  retry_delay: 1    # Reduced delay between retries

# Global Pool Settings
global:
  # Environment
  environment: "development"  # development, staging, production
  debug: true
  
  # Logging
  log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  log_format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  # Monitoring
  enable_metrics: true
  metrics_interval: 60  # seconds
  
  # Performance - Increased for >10 concurrent users
  max_concurrent_operations: 100  # Increased from 50
  operation_timeout: 180  # Reduced from 300 for faster response
  
  # Memory management - More aggressive monitoring
  enable_memory_monitoring: true
  memory_warning_threshold: 75  # Reduced from 80 for earlier warnings
  memory_critical_threshold: 90  # Reduced from 95 for better safety
  
  # Graceful shutdown
  shutdown_timeout: 30  # seconds

# Development Settings (only used in development environment)
development:
  # Enable additional debugging
  verbose_logging: true
  enable_profiling: false

  # Agent Pool settings (DEPRECATED - NOT USED)
  # agent_pool:
  #   min_agents: 5
  #   max_agents: 20
  #   agent_idle_timeout: 180
  #   scaling_check_interval: 15

  # INCREASED pool sizes for development to support 10-20 concurrent users
  llm_pool:
    min_connections: 5
    max_connections: 20

  rag_pool:
    pool_size: 20  # INCREASED from 2 to 20 for multi-user testing

  freecad_pool:
    min_clients: 5
    max_clients: 15
  
  # Faster health checks
  health_check_intervals:
    redis: 30
    llm: 30
    freecad: 60

# Production Settings (only used in production environment)
production:
  # Disable debugging
  debug: false
  verbose_logging: false

  # Agent Pool settings (DEPRECATED - NOT USED)
  # agent_pool:
  #   min_agents: 5
  #   max_agents: 20
  #   agent_idle_timeout: 600
  #   scaling_check_interval: 60
  #   max_concurrent_acquisitions: 50

  # Optimized pool sizes for production
  llm_pool:
    min_connections: 5
    max_connections: 20
  
  rag_pool:
    pool_size: 10
  
  freecad_pool:
    min_clients: 5
    max_clients: 15
  
  # Production health checks
  health_check_intervals:
    redis: 60
    llm: 120
    freecad: 180
  
  # Enhanced monitoring
  enable_detailed_metrics: true
  metrics_retention_days: 30

# Testing Settings (only used during testing)
testing:
  # Agent Pool settings (DEPRECATED - NOT USED)
  # agent_pool:
  #   min_agents: 1
  #   max_agents: 2
  #   agent_idle_timeout: 60
  #   scaling_check_interval: 5
  #   enable_auto_scaling: false

  # Minimal pool sizes for testing
  llm_pool:
    min_connections: 1
    max_connections: 2
  
  rag_pool:
    pool_size: 1
  
  freecad_pool:
    min_clients: 1
    max_clients: 1
  
  # Fast timeouts for testing
  redis:
    session_ttl: 300  # 5 minutes
  
  # Disable long-running processes
  health_check_intervals:
    redis: 10
    llm: 10
    freecad: 10